{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar sesi&oacute;n — Block de Notas{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-header">
      <svg viewBox="0 0 40 40" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="36" height="36">
        <circle cx="20" cy="14" r="6" />
        <path d="M10 34c0-8 4.5-12 10-12s10 4 10 12" />
        <rect x="8" y="6" width="24" height="28" rx="3" />
      </svg>
      <h1 class="auth-title">Iniciar sesi&oacute;n</h1>
      <p class="auth-sub">Ingresa tu correo y contrase&ntilde;a para acceder a tus notas.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label for="email">Correo electr&oacute;nico</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="tu@correo.com" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contrase&ntilde;a</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Ingresar</button>
        <a href="{% url 'crear' %}">¿No tienes cuenta? Reg&iacute;strate</a>
      </div>
    </form>
  </div>
</div>

<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}
